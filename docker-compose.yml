# Everything Formora needs on one server: the app, PostgreSQL, and Caddy
# (HTTPS for your domain and automatic certificates for customer domains).
#
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
#
# See docs/SELF_HOSTING.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: formora
      POSTGRES_USER: formora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formora -d formora"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://formora:${POSTGRES_PASSWORD}@db:5432/formora
      DATABASE_SSL: disable
    depends_on:
      db:
        condition: service_healthy

  # Runs the scheduled jobs every hour: trial and renewal emails, renewals,
  # monthly credits, automatic portfolio updates and clean-up.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    entrypoint: ["/bin/sh", "-c", "sleep 60; while true; do curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron || echo 'cron run failed'; echo; sleep 3600; done"]
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
